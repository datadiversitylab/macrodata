<div class="stats-section full-bleed">
  <p class="stats-label">MacroData en números</p>
  <div class="stats-grid">

    <div class="stat-item">
      <i class="fas fa-chalkboard-user"></i>
      <span class="stat-number" data-count="{{ site.data.stats.workshops }}" data-suffix="">{{ site.data.stats.workshops }}</span>
      <span class="stat-label">Talleres</span>
    </div>

    <div class="stat-item">
      <i class="fas fa-building-columns"></i>
      <span class="stat-number" data-count="{{ site.data.stats.universities }}" data-suffix="">{{ site.data.stats.universities }}</span>
      <span class="stat-label">Universidades</span>
    </div>

    <div class="stat-item">
      <i class="fas fa-graduation-cap"></i>
      <span class="stat-number" data-count="{{ site.data.stats.students }}" data-suffix="+">{{ site.data.stats.students }}+</span>
      <span class="stat-label">Estudiantes</span>
    </div>

    <div class="stat-item">
      <i class="fas fa-location-dot"></i>
      <span class="stat-number" data-count="{{ site.data.stats.cities }}" data-suffix="">{{ site.data.stats.cities }}</span>
      <span class="stat-label">Ciudades</span>
    </div>

    <div class="stat-item">
      <i class="fas fa-user-tie"></i>
      <span class="stat-number" data-count="{{ site.data.stats.instructors }}" data-suffix="+">{{ site.data.stats.instructors }}+</span>
      <span class="stat-label">Instructores</span>
    </div>

  </div>
</div>
