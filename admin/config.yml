# Decap CMS configuration
# Docs: https://decapcms.org/docs/configuration-options/

backend:
  name: git-gateway
  branch: master

media_folder: "assets/img"
public_folder: "/assets/img"

collections:

  # ── Pages ──────────────────────────────────────────────────────────────────
  - name: "pages"
    label: "Páginas"
    files:

      - label: "Inicio"
        name: "index"
        file: "index.html"
        fields:
          - { label: "Subtítulo", name: "subtitle", widget: "string" }
          - { label: "Imagen de portada (banner)", name: "cover-img", widget: "image" }

      - label: "El Proyecto"
        name: "aboutme"
        file: "aboutme.md"
        fields:
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Subtítulo", name: "subtitle", widget: "string", required: false }
          - { label: "Imagen de portada", name: "cover-img", widget: "image", required: false }
          - { label: "Contenido", name: "body", widget: "markdown" }

      - label: "Fechas"
        name: "fechas"
        file: "fechas.md"
        fields:
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Subtítulo", name: "subtitle", widget: "string", required: false }
          - { label: "Contenido", name: "body", widget: "markdown" }

      - label: "Objetivos"
        name: "objetivos"
        file: "objetivos.md"
        fields:
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Subtítulo", name: "subtitle", widget: "string", required: false }
          - { label: "Contenido", name: "body", widget: "markdown" }

      - label: "Contenidos del taller"
        name: "contenidos"
        file: "contenidos.md"
        fields:
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Subtítulo", name: "subtitle", widget: "string", required: false }
          - { label: "Contenido", name: "body", widget: "markdown" }

      - label: "Políticas"
        name: "politicas"
        file: "politicas.md"
        fields:
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Subtítulo", name: "subtitle", widget: "string", required: false }
          - { label: "Contenido", name: "body", widget: "markdown" }

      - label: "Aplicaciones"
        name: "aplicaciones"
        file: "aplicaciones.md"
        fields:
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Subtítulo", name: "subtitle", widget: "string", required: false }
          - { label: "Contenido", name: "body", widget: "markdown" }

      - label: "Logros y recursos"
        name: "logros"
        file: "logros.md"
        fields:
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Subtítulo", name: "subtitle", widget: "string", required: false }
          - { label: "Contenido", name: "body", widget: "markdown" }

      - label: "Quiénes somos"
        name: "quienes"
        file: "quienes.md"
        fields:
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Subtítulo", name: "subtitle", widget: "string", required: false }
          - { label: "Contenido", name: "body", widget: "markdown" }

      - label: "Galería"
        name: "galerias"
        file: "galerias.md"
        fields:
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Subtítulo", name: "subtitle", widget: "string", required: false }
          - { label: "Imagen de portada", name: "cover-img", widget: "image", required: false }

      - label: "Proyecto final"
        name: "proyecto-final"
        file: "proyecto-final.md"
        fields:
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Subtítulo", name: "subtitle", widget: "string" }
          - { label: "Imagen de portada", name: "cover-img", widget: "image", required: false }

  # ── Noticias ───────────────────────────────────────────────────────────────
  - name: "posts"
    label: "Noticias"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Subtítulo", name: "subtitle", widget: "string", required: false }
      - { label: "Imagen miniatura", name: "thumbnail-img", widget: "image", required: false }
      - { label: "Etiquetas", name: "tags", widget: "list", required: false }
      - { label: "Contenido", name: "body", widget: "markdown" }

  # ── Datos del sitio ────────────────────────────────────────────────────────
  - name: "data"
    label: "Datos del sitio"
    files:

      - label: "Estadísticas"
        name: "stats"
        file: "_data/stats.yml"
        fields:
          - { label: "Talleres", name: "workshops", widget: "number" }
          - { label: "Universidades", name: "universities", widget: "number" }
          - { label: "Estudiantes", name: "students", widget: "number" }
          - { label: "Ciudades", name: "cities", widget: "number" }
          - { label: "Instructores", name: "instructors", widget: "number" }

      - label: "Eventos y galerías"
        name: "events"
        file: "_data/events.yml"
        fields:

          - label: "Universidad de la Salle"
            name: "lasalle"
            widget: "object"
            fields:
              - { label: "Estado", name: "status", widget: "select", options: ["completado", "activo", "proximo"] }
              - label: "Foto principal"
                name: "main_photo"
                widget: "object"
                fields:
                  - { label: "Imagen", name: "src", widget: "image", required: false }
                  - label: "Participantes (una línea por grupo)"
                    name: "participants"
                    widget: "list"
                    required: false
              - label: "Galería adicional"
                name: "gallery"
                widget: "list"
                label_singular: "Foto"
                required: false
                fields:
                  - { label: "Imagen", name: "src", widget: "image" }

          - label: "Universidad del Atlántico"
            name: "atlantico"
            widget: "object"
            fields:
              - { label: "Estado", name: "status", widget: "select", options: ["completado", "activo", "proximo"] }
              - label: "Foto principal"
                name: "main_photo"
                widget: "object"
                fields:
                  - { label: "Imagen", name: "src", widget: "image", required: false }
                  - label: "Participantes (una línea por grupo)"
                    name: "participants"
                    widget: "list"
                    required: false
              - label: "Galería adicional"
                name: "gallery"
                widget: "list"
                label_singular: "Foto"
                required: false
                fields:
                  - { label: "Imagen", name: "src", widget: "image" }

          - label: "Universidad de Nariño"
            name: "narino"
            widget: "object"
            fields:
              - { label: "Estado", name: "status", widget: "select", options: ["completado", "activo", "proximo"] }
              - label: "Foto principal"
                name: "main_photo"
                widget: "object"
                fields:
                  - { label: "Imagen", name: "src", widget: "image", required: false }
                  - label: "Participantes (una línea por grupo)"
                    name: "participants"
                    widget: "list"
                    required: false
              - label: "Galería adicional"
                name: "gallery"
                widget: "list"
                label_singular: "Foto"
                required: false
                fields:
                  - { label: "Imagen", name: "src", widget: "image" }

          - label: "Universidad Tecnológica del Chocó"
            name: "choco"
            widget: "object"
            fields:
              - { label: "Estado", name: "status", widget: "select", options: ["completado", "activo", "proximo"] }
              - label: "Foto principal"
                name: "main_photo"
                widget: "object"
                fields:
                  - { label: "Imagen", name: "src", widget: "image", required: false }
                  - label: "Participantes (una línea por grupo)"
                    name: "participants"
                    widget: "list"
                    required: false
              - label: "Galería adicional"
                name: "gallery"
                widget: "list"
                label_singular: "Foto"
                required: false
                fields:
                  - { label: "Imagen", name: "src", widget: "image" }
